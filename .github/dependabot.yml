version: 2

updates:
  # Actions used by workflows in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]

  # Base image for the Hono API container
  - package-ecosystem: "docker"
    directory: "/apps/server"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  # Covers `workspaces.catalog` entries since dependabot-core#16544. Version
  # updates only: alerts come from workflows/dependency-graph.yml, because
  # GitHub's dependency graph does not read bun.lock.
  # https://github.com/dependabot/dependabot-core/pull/16544
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # A package joins the first group it matches, so the family groups come
    # first. They take majors too: a split @sentry/* set loads two SDK copies,
    # and ai without @ai-sdk/otel fails to typecheck.
    # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#groups
    groups:
      sentry:
        patterns: ["@sentry/*"]
      ai-sdk:
        patterns: ["ai", "@ai-sdk/*"]
      bun-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
