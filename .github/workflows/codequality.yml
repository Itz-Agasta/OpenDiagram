name: Code Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bun version comes from `packageManager` in the root package.json
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: just check-ci

      - name: Typecheck
        run: just types

      - name: Harness tests
        run: just test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Placeholder value: the build only has to prove everything bundles, but
      # NEXT_PUBLIC_SERVER_URL is read at build time by src/lib/auth-client.ts,
      # which throws without it. Turbo passes NEXT_PUBLIC_* through to the task
      # automatically via framework inference.
      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_SERVER_URL: "http://localhost:3000"
